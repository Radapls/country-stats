<div class="toolbar">
  <input
    placeholder="Type a country"
    type="text"
    [(ngModel)]="searchContents"
    />

  <select #selectList (change)="getRegion($event)">
    <option value="">None</option>
    @for (region of itemRegions; track region) {
      <option [value]="region">
        {{ region }}
      </option>
    }
  </select>
</div>
